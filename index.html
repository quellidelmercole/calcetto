<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚽ Calcetto Mercoledì</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700;900&display=swap');

  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #30363d;
    --green: #1aff6e;
    --green-dim: #0d7a34;
    --green-bg: #0a2e1a;
    --yellow: #ffd60a;
    --yellow-dim: #8a7000;
    --yellow-bg: #2e2800;
    --white: #e6edf3;
    --muted: #8b949e;
    --red: #ff4757;
    --accent: #1aff6e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    overscroll-behavior: none;
  }

  /* ── HEADER ── */
  #header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--surface);
    border-bottom: 2px solid var(--border);
    padding: 0;
  }

  #header-top {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px 10px;
    border-bottom: 1px solid var(--border);
  }

  #logo-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    cursor: default;
    user-select: none;
  }

  #logo-svg {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
  }

  #logo-text {
    display: flex;
    flex-direction: column;
    line-height: 1;
  }

  #logo-text .team-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 2px;
    color: var(--white);
  }

  #logo-text .team-sub {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 2px;
  }

  #day-badge {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
  }

  /* Reset nascosto — appare solo dopo 3 tap sul logo */
  #btn-reset {
    display: none;
    font-family: 'Barlow', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: transparent;
    color: var(--red);
    border: 1px solid var(--red);
    border-radius: 8px;
    padding: 6px 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  #btn-reset.visible { display: inline-block; }
  #btn-reset:hover { background: rgba(255,71,87,0.1); }

  /* ── STATUS BAR ── */
  #status-bar {
    display: flex;
    gap: 0;
    height: 52px;
  }

  .status-pill {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 1.5px;
    border-right: 1px solid var(--border);
    transition: background 0.3s;
  }
  .status-pill:last-child { border-right: none; }

  #pill-presenti {
    color: var(--muted);
  }
  #pill-presenti.active {
    background: var(--green-bg);
    color: var(--green);
  }
  #pill-presenti.full {
    background: var(--green-bg);
    color: var(--green);
    animation: pulse-green 1.5s ease infinite;
  }

  #pill-riserve {
    color: var(--muted);
  }
  #pill-riserve.active {
    background: var(--yellow-bg);
    color: var(--yellow);
  }

  .pill-num {
    font-size: 24px;
    line-height: 1;
  }
  .pill-label {
    font-size: 13px;
    letter-spacing: 2px;
  }

  @keyframes pulse-green {
    0%, 100% { background: var(--green-bg); }
    50% { background: #0f3d22; }
  }

  /* ── PROGRESS BAR ── */
  #progress-wrap {
    height: 3px;
    background: var(--surface2);
    overflow: hidden;
  }
  #progress-bar {
    height: 100%;
    background: var(--green);
    width: 0%;
    transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 0 12px var(--green);
  }
  #progress-bar.full {
    width: 100% !important;
    background: var(--green);
  }

  /* ── CONFIRMED BANNER ── */
  #confirmed-banner {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--green);
    color: #000;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 3px;
    padding: 10px;
    animation: flash-banner 0.6s ease;
  }
  #confirmed-banner.show { display: flex; }

  @keyframes flash-banner {
    0% { transform: scaleY(0); opacity: 0; }
    100% { transform: scaleY(1); opacity: 1; }
  }

  /* ── WEEK LABEL BAR ── */
  #actions-bar {
    padding: 10px 16px 0;
    display: flex;
    gap: 10px;
    align-items: center;
  }

  #week-label {
    flex: 1;
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
  }

  #btn-reset {
    font-family: 'Barlow', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  #btn-reset:hover {
    border-color: var(--red);
    color: var(--red);
  }

  /* ── PLAYER GRID ── */
  #grid-wrap {
    padding: 12px 12px 80px;
  }

  #section-presenti-label, #section-riserve-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 16px 4px 8px;
  }
  #section-riserve-label { display: none; }

  #grid-presenti, #grid-riserve {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  /* ── PLAYER CARD ── */
  .player-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 14px 12px;
    cursor: pointer;
    transition: transform 0.12s, border-color 0.2s, background 0.2s, box-shadow 0.2s;
    user-select: none;
    position: relative;
    overflow: hidden;
  }

  .player-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 12px;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .player-card:active {
    transform: scale(0.96);
  }

  .player-card .cognome {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 1px;
    line-height: 1;
    color: var(--white);
    transition: color 0.2s;
  }

  .player-card .nome {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    margin-top: 3px;
    transition: color 0.2s;
  }

  .player-card .check {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    font-size: 12px;
    font-weight: 700;
  }

  /* PRESENTE */
  .player-card.presente {
    background: var(--green-bg);
    border-color: var(--green-dim);
    box-shadow: 0 0 20px rgba(26,255,110,0.08);
  }
  .player-card.presente .cognome { color: var(--green); }
  .player-card.presente .nome { color: rgba(26,255,110,0.6); }
  .player-card.presente .check {
    background: var(--green);
    border-color: var(--green);
    color: #000;
    font-weight: 900;
  }

  /* BLOCCATO (lista piena, non cliccabile) */
  .player-card.presente.locked {
    cursor: not-allowed;
    opacity: 0.85;
  }
  .player-card.presente.locked::after {
    content: '🔒';
    position: absolute;
    bottom: 8px;
    right: 8px;
    font-size: 11px;
    opacity: 0.6;
  }

  /* RISERVA */
  .player-card.riserva {
    background: var(--yellow-bg);
    border-color: var(--yellow-dim);
    box-shadow: 0 0 20px rgba(255,214,10,0.08);
  }
  .player-card.riserva .cognome { color: var(--yellow); }
  .player-card.riserva .nome { color: rgba(255,214,10,0.6); }
  .player-card.riserva .check {
    background: var(--yellow);
    border-color: var(--yellow);
    color: #000;
    font-weight: 900;
  }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 30px;
    padding: 10px 22px;
    font-size: 14px;
    font-weight: 600;
    color: var(--white);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    white-space: nowrap;
    z-index: 200;
    pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* ── DIALOG CONFERMA ── */
  #dialog-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 300;
    align-items: center;
    justify-content: center;
    padding: 24px;
    backdrop-filter: blur(4px);
  }
  #dialog-overlay.show { display: flex; }

  #dialog-box {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 18px;
    padding: 28px 24px 22px;
    max-width: 320px;
    width: 100%;
    text-align: center;
    animation: dialog-in 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes dialog-in {
    from { transform: scale(0.85); opacity: 0; }
    to   { transform: scale(1);    opacity: 1; }
  }

  #dialog-icon {
    font-size: 40px;
    margin-bottom: 12px;
  }

  #dialog-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  #dialog-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 30px;
    letter-spacing: 1px;
    color: var(--white);
    line-height: 1;
    margin-bottom: 6px;
  }

  #dialog-nome {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 24px;
  }

  #dialog-question {
    font-size: 14px;
    color: var(--white);
    margin-bottom: 22px;
    line-height: 1.5;
  }

  #dialog-buttons {
    display: flex;
    gap: 12px;
  }

  #btn-no {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.15s;
  }
  #btn-no:active { background: var(--surface2); }

  #btn-si {
    flex: 2;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: var(--green);
    color: #000;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 900;
  }
  #btn-si:active { transform: scale(0.97); }
  #btn-si.riserva-mode {
    background: var(--yellow);
  }
  #btn-si.rimuovi-mode {
    background: var(--red);
    color: #fff;
  }

  /* ── LOADING ── */
  #loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    gap: 16px;
  }
  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── OFFLINE NOTICE ── */
  #offline-notice {
    display: none;
    background: #2e1800;
    border-bottom: 1px solid #8a4000;
    color: #ffa500;
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    padding: 6px;
    letter-spacing: 0.5px;
  }
  #offline-notice.show { display: block; }

  /* ── PILL STATISTICHE ── */
  #pill-stats {
    cursor: pointer;
    transition: background 0.2s;
  }
  #pill-stats:active { background: var(--surface2); }
  #pill-stats.active-page {
    background: #1a1a3a;
    color: #7b8cff;
  }

  /* ── PAGINA STATISTICHE ── */
  #stats-page {
    display: none;
    padding: 12px 12px 80px;
  }
  #stats-page.show { display: block; }

  #stats-header {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 12px 4px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #stats-header span { color: var(--muted); font-size: 11px; }

  #stats-note {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    padding: 10px;
    margin-bottom: 8px;
    background: var(--surface);
    border-radius: 10px;
    border: 1px solid var(--border);
    line-height: 1.6;
  }

  .stat-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    transition: border-color 0.2s;
  }

  .stat-rank {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    color: var(--muted);
    min-width: 28px;
    text-align: center;
  }
  .stat-rank.gold   { color: #ffd700; }
  .stat-rank.silver { color: #c0c0c0; }
  .stat-rank.bronze { color: #cd7f32; }

  .stat-info { flex: 1; }
  .stat-cognome {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 19px;
    letter-spacing: 1px;
    color: var(--white);
    line-height: 1;
  }
  .stat-nome {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .stat-bar-wrap {
    flex: 1;
    max-width: 120px;
  }
  .stat-bar-bg {
    height: 6px;
    background: var(--surface2);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 4px;
  }
  .stat-bar-fill {
    height: 100%;
    border-radius: 3px;
    background: var(--green);
    transition: width 0.6s cubic-bezier(0.34,1.2,0.64,1);
  }
  .stat-pct {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    color: var(--muted);
    text-align: right;
  }

  .stat-pct-big {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    color: var(--green);
    min-width: 56px;
    text-align: right;
    line-height: 1;
  }

  #stats-locked-msg {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.8;
  }
  #stats-locked-msg .lock-icon { font-size: 40px; margin-bottom: 12px; }

  /* NUMERIC BADGE */
  .num-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 28px;
    height: 28px;
    border-radius: 14px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    line-height: 1;
    padding: 0 4px;
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <span style="color:var(--muted);font-size:14px;letter-spacing:1px;">Connessione in corso…</span>
</div>

<div id="app" style="display:none;">

  <div id="offline-notice">⚠️ Modalità offline – le modifiche verranno sincronizzate alla riconnessione</div>

  <div id="header">
    <div id="header-top">
      <div id="logo-wrap">
        <svg id="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <!-- Scarpa sinistra (dietro) -->
          <g opacity="0.65" transform="translate(4, 6) rotate(-8, 50, 60)">
            <!-- Tomaia -->
            <path d="M22 58 Q20 48 26 40 Q32 33 42 32 L58 33 Q64 34 66 40 L64 58 Z"
                  fill="#0d7a34" stroke="#1aff6e" stroke-width="1.2"/>
            <!-- Linguetta -->
            <path d="M38 32 Q40 26 44 25 Q48 24 50 26 L50 33 L38 33 Z"
                  fill="#0a5c28" stroke="#1aff6e" stroke-width="0.8"/>
            <!-- Suola -->
            <path d="M20 58 Q18 62 20 65 L68 65 Q72 65 72 62 L64 58 Z"
                  fill="#085020" stroke="#1aff6e" stroke-width="1"/>
            <!-- Tacchetti -->
            <rect x="24" y="64" width="7" height="4" rx="1.5" fill="#1aff6e" opacity="0.8"/>
            <rect x="36" y="64" width="7" height="4" rx="1.5" fill="#1aff6e" opacity="0.8"/>
            <rect x="48" y="64" width="7" height="4" rx="1.5" fill="#1aff6e" opacity="0.8"/>
            <rect x="60" y="64" width="7" height="4" rx="1.5" fill="#1aff6e" opacity="0.8"/>
            <!-- Lacci -->
            <line x1="39" y1="35" x2="61" y2="35" stroke="#1aff6e" stroke-width="1" opacity="0.9"/>
            <line x1="38" y1="40" x2="63" y2="40" stroke="#1aff6e" stroke-width="1" opacity="0.9"/>
            <line x1="38" y1="45" x2="63" y2="45" stroke="#1aff6e" stroke-width="1" opacity="0.9"/>
            <line x1="38" y1="50" x2="63" y2="50" stroke="#1aff6e" stroke-width="1" opacity="0.9"/>
          </g>
          <!-- Scarpa destra (davanti) -->
          <g transform="translate(-4, -2) rotate(10, 50, 60)">
            <!-- Tomaia -->
            <path d="M28 62 Q26 52 32 44 Q38 37 48 36 L62 37 Q68 38 70 44 L68 62 Z"
                  fill="#1aff6e" stroke="#0d7a34" stroke-width="1.2"/>
            <!-- Linguetta -->
            <path d="M44 36 Q46 30 50 29 Q54 28 56 30 L56 37 L44 37 Z"
                  fill="#a0ffc0" stroke="#0d7a34" stroke-width="0.8"/>
            <!-- Suola -->
            <path d="M26 62 Q24 66 26 69 L72 69 Q76 69 76 66 L68 62 Z"
                  fill="#085020" stroke="#0d7a34" stroke-width="1"/>
            <!-- Tacchetti -->
            <rect x="30" y="68" width="7" height="4" rx="1.5" fill="#e6edf3" opacity="0.9"/>
            <rect x="42" y="68" width="7" height="4" rx="1.5" fill="#e6edf3" opacity="0.9"/>
            <rect x="54" y="68" width="7" height="4" rx="1.5" fill="#e6edf3" opacity="0.9"/>
            <rect x="66" y="68" width="7" height="4" rx="1.5" fill="#e6edf3" opacity="0.9"/>
            <!-- Lacci -->
            <line x1="45" y1="39" x2="67" y2="39" stroke="#085020" stroke-width="1.2" opacity="0.9"/>
            <line x1="44" y1="44" x2="67" y2="44" stroke="#085020" stroke-width="1.2" opacity="0.9"/>
            <line x1="44" y1="49" x2="67" y2="49" stroke="#085020" stroke-width="1.2" opacity="0.9"/>
            <line x1="44" y1="54" x2="67" y2="54" stroke="#085020" stroke-width="1.2" opacity="0.9"/>
          </g>
        </svg>
        <div id="logo-text">
          <span class="team-name">QUELLI DEL MERCOLE'</span>
          <span class="team-sub">Calcetto · Mercoledì</span>
        </div>
      </div>
      <div id="day-badge">⚽ Mercoledì</div>
      <button id="btn-reset">🔄 Reset</button>
    </div>
    <div id="status-bar">
      <div class="status-pill" id="pill-presenti">
        <span class="pill-label">PRESENTI</span>
        <span class="pill-num num-badge" id="count-presenti">0</span>
        <span class="pill-label">/ 10</span>
      </div>
      <div class="status-pill" id="pill-riserve">
        <span class="pill-label">RISERVE</span>
        <span class="pill-num num-badge" id="count-riserve">0</span>
      </div>
      <div class="status-pill" id="pill-stats">
        <span class="pill-label">📊 STATS</span>
      </div>
    </div>
    <div id="progress-wrap"><div id="progress-bar"></div></div>
    <div id="confirmed-banner">✅ LISTA COMPLETA — SI GIOCA!</div>
  </div>

  <div id="actions-bar">
    <span id="week-label">Settimana corrente</span>
  </div>

  <!-- Pagina Statistiche -->
  <div id="stats-page">
    <div id="stats-header">
      <span>🏆 CLASSIFICA PRESENZE</span>
      <span id="stats-subtitle"></span>
    </div>
    <div id="stats-note"></div>
    <div id="stats-list"></div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, onValue, set, get } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

// ─────────────────────────────────────────────────────
// ⚠️  CONFIGURAZIONE FIREBASE
// Vai su https://console.firebase.google.com/
// Crea un progetto → Realtime Database → Regole: allow read, write: if true
// Poi incolla qui i tuoi dati di configurazione:
// ─────────────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyBL_WK3LwR7BRBubUjC27d7ZMYo4YOEv4A",
  authDomain: "calcetto-mercole.firebaseapp.com",
  databaseURL: "https://calcetto-mercole-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "calcetto-mercole",
  storageBucket: "calcetto-mercole.firebasestorage.app",
  messagingSenderId: "976761510415",
  appId: "1:976761510415:web:f3965294c2bfbf1ce5217a"
};
// ─────────────────────────────────────────────────────

const MAX_PRESENTI = 10;

// Lista giocatori
const PLAYERS = [
  { cognome: "BALBUSSO",  nome: "CLAUDIO" },
  { cognome: "BERGNACH",  nome: "CLAUDIO" },
  { cognome: "BORTUZZO",  nome: "GIORGIO" },

  { cognome: "D'URSO",    nome: "ANDREA" },
  { cognome: "GAVIN",     nome: "ALESSANDRO" },
  { cognome: "HARBERT",   nome: "RICHARD" },
  { cognome: "INGENITO",  nome: "LORENZO" },

];

// Calcola chiave settimana corrente (es. "2025-W12")
function getWeekKey() {
  // Settimana che inizia la DOMENICA e finisce il SABATO
  const now = new Date();
  const day = now.getDay(); // 0=dom, 1=lun, ... 6=sab
  const sunday = new Date(now);
  sunday.setDate(now.getDate() - day); // torna alla domenica
  sunday.setHours(0, 0, 0, 0);
  // Chiave: anno + numero settimana basato sulla domenica
  const yearStart = new Date(sunday.getFullYear(), 0, 1);
  const weekNo = Math.ceil(((sunday - yearStart) / 86400000 + 1) / 7);
  return `${sunday.getFullYear()}-SW${String(weekNo).padStart(2, '0')}`;
}

function getWeekLabel() {
  const now = new Date();
  const day = now.getDay(); // 0=dom
  const sunday = new Date(now);
  sunday.setDate(now.getDate() - day);
  const saturday = new Date(sunday);
  saturday.setDate(sunday.getDate() + 6);
  const mesi = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
  const dom = `${sunday.getDate()} ${mesi[sunday.getMonth()]}`;
  const sab = `${saturday.getDate()} ${mesi[saturday.getMonth()]}`;
  return `📅 ${dom} – ${sab} ${saturday.getFullYear()}`;
}

// ─── DEMO MODE (senza Firebase) ──────────────────────
const isDemo = firebaseConfig.apiKey === "INSERISCI-LA-TUA-API-KEY";
let demoState = {};

// Stato presenze: { "BALBUSSO_CLAUDIO": "presente" | "riserva:TIMESTAMP" | null }
let state = {};

// ─── INIT ────────────────────────────────────────────
let db, weekRef;

// ── STATISTICHE ─────────────────────────────────────
const STATS_START = new Date('2026-03-29'); // Data inizio conteggio

function getStatsWeekKey(dateObj) {
  // Stesso algoritmo di getWeekKey() ma per una data specifica
  const day = dateObj.getDay();
  const sunday = new Date(dateObj);
  sunday.setDate(dateObj.getDate() - day);
  sunday.setHours(0,0,0,0);
  const yearStart = new Date(sunday.getFullYear(), 0, 1);
  const weekNo = Math.ceil(((sunday - yearStart) / 86400000 + 1) / 7);
  return `${sunday.getFullYear()}-SW${String(weekNo).padStart(2,'0')}`;
}

function toggleStatsPage() {
  const statsPage = document.getElementById('stats-page');
  const gridWrap  = document.getElementById('grid-wrap');
  const pill      = document.getElementById('pill-stats');
  const actionsBar = document.getElementById('actions-bar');

  const isOpen = statsPage.classList.contains('show');
  if (isOpen) {
    statsPage.classList.remove('show');
    gridWrap.style.display = '';
    actionsBar.style.display = '';
    pill.classList.remove('active-page');
  } else {
    statsPage.classList.add('show');
    gridWrap.style.display = 'none';
    actionsBar.style.display = 'none';
    pill.classList.add('active-page');
    renderStats();
  }
}

async function renderStats() {
  const listEl   = document.getElementById('stats-list');
  const lockedEl = document.getElementById('stats-locked-msg');
  const noteEl   = document.getElementById('stats-note');
  const subEl    = document.getElementById('stats-subtitle');

  listEl.innerHTML = '';

  lockedEl.style.display = 'none';

  // Calcola tutte le settimane dal STATS_START ad oggi
  const now = new Date();
  const settimane = [];
  let cur = new Date(STATS_START);
  while (cur <= now) {
    settimane.push(getStatsWeekKey(cur));
    cur.setDate(cur.getDate() + 7);
  }
  // Includi settimana corrente se non già inclusa
  const curKey = getWeekKey();
  if (!settimane.includes(curKey)) settimane.push(curKey);

  const totaleSettimane = settimane.length;
  subEl.textContent = `${totaleSettimane} partite`;

  // Carica tutte le settimane da Firebase in parallelo
  const presenze = {}; // { playerKey: conteggio }
  PLAYERS.forEach(p => { presenze[playerKey(p)] = 0; });

  const promises = settimane.map(wk =>
    get(ref(db, `calcetto/${wk}`)).then(snap => {
      const data = snap.val() || {};
      PLAYERS.forEach(p => {
        const k = playerKey(p);
        if (getStatType(data[k]) === 'presente') {
          presenze[k] = (presenze[k] || 0) + 1;
        }
      });
    }).catch(() => {})
  );
  await Promise.all(promises);

  // Ordina dal migliore al peggiore
  const classifica = PLAYERS
    .map(p => ({
      p,
      key: playerKey(p),
      presenze: presenze[playerKey(p)] || 0,
      pct: totaleSettimane > 0
        ? Math.round((presenze[playerKey(p)] || 0) / totaleSettimane * 100)
        : 0
    }))
    .sort((a, b) => b.pct - a.pct || b.presenze - a.presenze || a.p.cognome.localeCompare(b.p.cognome));

  noteEl.style.display = '';
  noteEl.textContent   = `Dal 29 mar 2026 · ${totaleSettimane} settiman${totaleSettimane === 1 ? 'a' : 'e'} giocate`;

  classifica.forEach((item, i) => {
    const rank = i + 1;
    const rankClass = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
    const rankIcon  = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;

    // Colore barra in base alla percentuale
    const barColor = item.pct >= 70 ? 'var(--green)'
                   : item.pct >= 40 ? 'var(--yellow)'
                   : 'var(--red)';

    const row = document.createElement('div');
    row.className = 'stat-row';
    row.innerHTML = `
      <div class="stat-rank ${rankClass}">${rankIcon}</div>
      <div class="stat-info">
        <div class="stat-cognome">${item.p.cognome}</div>
        <div class="stat-nome">${item.p.nome} · ${item.presenze}/${totaleSettimane}</div>
        <div class="stat-bar-wrap" style="max-width:100%;margin-top:6px;">
          <div class="stat-bar-bg">
            <div class="stat-bar-fill" style="width:${item.pct}%;background:${barColor};"></div>
          </div>
        </div>
      </div>
      <div class="stat-pct-big" style="color:${barColor};">${item.pct}%</div>
    `;
    listEl.appendChild(row);
  });
}

// ── Dialog di conferma ──────────────────────────────
function showDialog(p, key, currentRaw, nPresenti) {
  const currentStat = getStatType(currentRaw);

  // Blocco lista piena
  if (currentStat === 'presente' && nPresenti >= MAX_PRESENTI) {
    showToast('🔒 Lista bloccata — i 10 posti sono confermati!');
    return;
  }

  const overlay = document.getElementById('dialog-overlay');
  const btnSi   = document.getElementById('btn-si');
  const btnNo   = document.getElementById('btn-no');

  // Contenuto dialog
  document.getElementById('dialog-name').textContent = p.cognome;
  document.getElementById('dialog-nome').textContent = p.nome;

  if (!currentStat) {
    // Vuole aggiungersi
    const saraPosto = nPresenti < MAX_PRESENTI;
    document.getElementById('dialog-icon').textContent = saraPosto ? '🟢' : '🟡';
    document.getElementById('dialog-question').textContent =
      saraPosto
        ? 'Confermi la tua presenza per mercoledì?'
        : 'I 10 posti sono esauriti. Vuoi metterti in lista riserve?';
    btnSi.textContent = 'SÌ';
    btnSi.className = saraPosto ? '' : 'riserva-mode';
  } else {
    // Vuole togliersi
    document.getElementById('dialog-icon').textContent = '❌';
    document.getElementById('dialog-question').textContent =
      currentStat === 'presente'
        ? 'Vuoi rimuovere la tua presenza?'
        : 'Vuoi rimuoverti dalla lista riserve?';
    btnSi.textContent = 'SÌ, RIMUOVI';
    btnSi.className = 'rimuovi-mode';
  }

  overlay.classList.add('show');

  // Clona i bottoni per rimuovere vecchi listener
  const newBtnSi = btnSi.cloneNode(true);
  const newBtnNo = btnNo.cloneNode(true);
  btnSi.parentNode.replaceChild(newBtnSi, btnSi);
  btnNo.parentNode.replaceChild(newBtnNo, btnNo);

  newBtnSi.addEventListener('click', () => {
    overlay.classList.remove('show');
    handleClick(p, key, currentRaw, nPresenti);
  });
  newBtnNo.addEventListener('click', () => {
    overlay.classList.remove('show');
  });

  // Chiudi cliccando fuori
  overlay.onclick = (e) => {
    if (e.target === overlay) overlay.classList.remove('show');
  };
}

function showToast(msg, duration = 2200) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), duration);
}

function playerKey(p) {
  return `${p.cognome}_${p.nome}`.replace(/'/g, '_');
}

function getStatType(val) {
  if (!val) return null;
  if (val === 'presente') return 'presente';
  if (typeof val === 'string' && val.startsWith('riserva')) return 'riserva';
  return null;
}

function getRiservaTs(val) {
  if (!val || !val.startsWith('riserva:')) return 0;
  return parseInt(val.split(':')[1]) || 0;
}

function updateUI(newState) {
  state = newState || {};
  const presenti = PLAYERS.filter(p => getStatType(state[playerKey(p)]) === 'presente');
  const riserve  = PLAYERS.filter(p => getStatType(state[playerKey(p)]) === 'riserva');
  const nP = presenti.length;
  const nR = riserve.length;

  // Aggiorna counter
  document.getElementById('count-presenti').textContent = nP;
  document.getElementById('count-riserve').textContent  = nR;

  // Progress bar
  const pct = Math.min(100, (nP / MAX_PRESENTI) * 100);
  const bar = document.getElementById('progress-bar');
  bar.style.width = pct + '%';
  bar.classList.toggle('full', nP >= MAX_PRESENTI);

  // Pills attive
  const pillP = document.getElementById('pill-presenti');
  pillP.classList.remove('active','full');
  if (nP >= MAX_PRESENTI) pillP.classList.add('full');
  else if (nP > 0) pillP.classList.add('active');

  const pillR = document.getElementById('pill-riserve');
  pillR.classList.toggle('active', nR > 0);

  // Banner confermato
  const banner = document.getElementById('confirmed-banner');
  banner.classList.toggle('show', nP >= MAX_PRESENTI);

  // Sezione riserve
  document.getElementById('section-riserve-label').style.display = nR > 0 ? '' : 'none';

  // Render cards — normali
  const gridP = document.getElementById('grid-presenti');
  gridP.innerHTML = '';
  const gridR = document.getElementById('grid-riserve');
  gridR.innerHTML = '';

  const listaBloccata = nP >= MAX_PRESENTI;

  PLAYERS.forEach(p => {
    const key     = playerKey(p);
    const raw     = state[key] || null;
    const stat    = getStatType(raw);
    const isLocked = stat === 'presente' && listaBloccata;
    const card = document.createElement('div');
    card.className = 'player-card' + (stat ? ' ' + stat : '') + (isLocked ? ' locked' : '');
    card.dataset.key = key;
    card.innerHTML = `
      <div class="check">${stat ? '✓' : ''}</div>
      <div class="cognome">${p.cognome}</div>
      <div class="nome">${p.nome}</div>
    `;
    // Calcola numero d'ordine per le riserve (ordinato per timestamp reale)
    let riservaNum = '';
    if (stat === 'riserva') {
      const riserveOrdinati = PLAYERS
        .filter(pl => getStatType(state[playerKey(pl)]) === 'riserva')
        .sort((a, b) => getRiservaTs(state[playerKey(a)]) - getRiservaTs(state[playerKey(b)]));
      riservaNum = riserveOrdinati.findIndex(pl => playerKey(pl) === key) + 1;
    }

    card.innerHTML = `
      <div class="check">${stat === 'presente' ? '✓' : stat === 'riserva' ? riservaNum : ''}</div>
      <div class="cognome">${p.cognome}</div>
      <div class="nome">${p.nome}</div>
    `;

    card.addEventListener('click', () => showDialog(p, key, raw, nP));

    if (stat === 'riserva') gridR.appendChild(card);
    else gridP.appendChild(card);
  });

  // Week label
  document.getElementById('week-label').textContent = getWeekLabel();
}

async function handleClick(p, key, currentRaw, nPresenti) {
  const currentStat = getStatType(currentRaw);

  let newStat;
  if (!currentStat) {
    // Era assente → diventa presente o riserva
    if (nPresenti < MAX_PRESENTI) {
      newStat = 'presente';
      showToast(`✅ ${p.cognome} è PRESENTE`);
    } else {
      newStat = 'riserva:' + Date.now();
      showToast(`🟡 ${p.cognome} in RISERVA`);
    }
  } else {
    // Era riserva → torna assente (i presenti sono bloccati, gestito sopra)
    newStat = null;
    showToast(`❌ ${p.cognome} rimosso`);
  }

  if (isDemo) {
    const newState = { ...state, [key]: newStat };
    if (!newStat) delete newState[key];
    updateUI(newState);
  } else {
    const weekKey = getWeekKey();
    await set(ref(db, `calcetto/${weekKey}/${key}`), newStat);
  }
}

function renderApp() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = '';
}

// ── Tap segreto sul logo (3 tap rapidi) per mostrare/nascondere reset ──
let tapCount = 0, tapTimer;
document.getElementById('logo-wrap').addEventListener('click', () => {
  tapCount++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { tapCount = 0; }, 600);
  if (tapCount >= 3) {
    tapCount = 0;
    const btn = document.getElementById('btn-reset');
    btn.classList.toggle('visible');
    showToast(btn.classList.contains('visible') ? '🔐 Modalità admin' : '🔒 Admin nascosto');
  }
});

// Reset settimana
document.getElementById('btn-reset').addEventListener('click', async () => {
  if (!confirm('Sei sicuro di voler azzerare tutte le presenze di questa settimana?')) return;
  if (isDemo) {
    updateUI({});
    showToast('🔄 Presenze azzerate');
  } else {
    const weekKey = getWeekKey();
    await set(ref(db, `calcetto/${weekKey}`), null);
    showToast('🔄 Presenze azzerate');
  }
});

// Pill statistiche
document.getElementById('pill-stats').addEventListener('click', toggleStatsPage);

// Online/offline
window.addEventListener('offline', () => document.getElementById('offline-notice').classList.add('show'));
window.addEventListener('online',  () => document.getElementById('offline-notice').classList.remove('show'));

// ─── START ───────────────────────────────────────────
if (isDemo) {
  // Modalità demo senza Firebase
  console.warn('⚠️ Firebase non configurato — modalità demo locale.');
  renderApp();
  updateUI({});
} else {
  const app = initializeApp(firebaseConfig);
  db = getDatabase(app);
  const weekKey = getWeekKey();
  weekRef = ref(db, `calcetto/${weekKey}`);

  // Ascolta in real-time
  onValue(weekRef, (snapshot) => {
    renderApp();
    updateUI(snapshot.val() || {});
  }, (err) => {
    console.error('Firebase error:', err);
    renderApp();
    updateUI({});
    showToast('⚠️ Errore connessione – modalità offline');
  });
}
</script>
